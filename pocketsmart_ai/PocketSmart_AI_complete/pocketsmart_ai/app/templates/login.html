{% extends "base.html" %}{% block title %}Login · PocketSmart AI{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1>{% if request.query_params.get('error') %}<div class="alert">Invalid email or password.</div>{% endif %}<form method="post" action="/login"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="btn primary full">Login</button></form><p>New here? <a href="/register">Create an account</a></p></div></section>{% endblock %}
